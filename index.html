<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
/>
<title>ShopTracker</title>

<!-- Favicons & Apple Touch Icon (for Safari home screen shortcut) -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115" />

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0f1115;
    --card:#151821;
    --card-2:#191d27;
    --text:#e7e9ef;
    --muted:#a4adbd;
    --line:rgba(255,255,255,.08);
    --primary:#7ea8ff;
    --danger:#ff5d5d;
    --radius:16px;
    --shadow:0 12px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{ -webkit-text-size-adjust:100%; touch-action:manipulation; }
  body{
    margin:0; color:var(--text);
    background:
      radial-gradient(800px 480px at 70% -120px, rgba(126,168,255,.14), transparent 60%),
      radial-gradient(520px 360px at -20% 10%, rgba(92,115,255,.10), transparent 60%),
      var(--bg);
    font-family: Inter, -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  header{
    position:sticky; top:0; z-index:10; padding:16px;
    background:linear-gradient(180deg, rgba(15,17,21,.9), rgba(15,17,21,.6) 60%, transparent);
    backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
  }
  .hero{display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:820px; margin:0 auto}
  .brand h1{margin:0; font-size:1.2rem; font-weight:800}
  .brand p{margin:4px 0 0; color:var(--muted); font-size:.9rem}
  .nav{display:flex; gap:8px}
  .btn{
    appearance:none; border:none; border-radius:12px; padding:.65rem .95rem;
    font-weight:700; background:var(--primary); color:#0b1324; box-shadow:var(--shadow); cursor:pointer;
    font-size:16px; transition: transform .08s ease, box-shadow .2s ease;
  }
  .btn:hover{ box-shadow:0 16px 36px rgba(126,168,255,.28); }
  .btn:active{ transform:translateY(1px); }
  .btn-ghost{background:rgba(255,255,255,.06); color:#dfe7ff; box-shadow:none; border:1px solid var(--line);}

  main{padding:16px 16px 28px; max-width:820px; margin:0 auto}

  /* Cards */
  .list{display:flex; flex-direction:column; gap:12px}
  .card{background:linear-gradient(180deg, var(--card), var(--card-2)); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow)}
  .card-header{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .badge{width:46px; height:46px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid var(--line);}
  .badge img{width:22px; height:22px; display:block; opacity:.95; filter: invert(92%) sepia(2%) saturate(300%) hue-rotate(185deg) brightness(106%) contrast(90%);}
  .meta{flex:1}
  .meta h2{margin:0; font-size:1.02rem; font-weight:800}
  .meta p{margin:.2rem 0 0; color:var(--muted); font-size:.86rem}
  .chev{opacity:.8; transition: transform .2s ease}
  .card-header[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .panel{display:none; margin-top:10px; border-top:1px dashed var(--line); padding-top:10px}
  .panel.open{display:block; animation:drop .2s ease-out}
  @keyframes drop{from{opacity:.3; transform:translateY(-2px)} to{opacity:1; transform:none}}

  /* Shops + items */
  .shop{background:rgba(255,255,255,.02); border:1px solid var(--line); border-radius:12px; padding:10px; margin:10px 0}
  .shop h3{margin:0 0 6px; font-size:.98rem; display:flex; align-items:center; justify-content:space-between}
  .shop hr{border:0; border-top:1px solid var(--line); margin:8px 0}
  .items{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px}
  .item{display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:10px; padding:8px; border-radius:10px; background:rgba(255,255,255,.02); border:1px solid var(--line)}
  .item.done label{text-decoration:line-through; color:#9ba6b8}
  .remove{border:none; border-radius:10px; padding:.45rem .6rem; font-weight:700; background:transparent; color:#ffb2b2; cursor:pointer;}
  .remove:hover{background:rgba(255,93,93,.1);}
  .pill{display:inline-block; min-width:22px; padding:.15rem .45rem; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid var(--line); font-size:.78rem; text-align:center}

  /* Edit sections */
  .section{background:linear-gradient(180deg, var(--card), var(--card-2)); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); margin-bottom:14px}
  .section h2{margin:0 0 10px; font-size:1.05rem}
  .row{display:grid; grid-template-columns:1fr; gap:10px}
  .label{font-size:.9rem; color:#dbe4ff; font-weight:700}
  .input, .select{
    appearance:none; width:100%; padding:.75rem .9rem; border-radius:12px;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); color:var(--text);
    font-size:16px; /* avoids iOS zoom on focus */
  }
  .inline{display:flex; gap:8px; flex-wrap:wrap}
  .small{color:var(--muted); font-size:.85rem}
  .note{color:var(--muted); text-align:center; margin-top:6px; font-size:.9rem}
</style>
</head>

<body>
  <header>
    <div class="hero">
      <div class="brand">
        <h1 id="title">ShopTracker</h1>
        <p id="subtitle">Organize purchases by label & shop</p>
      </div>
      <div class="nav">
        <button id="goHome" class="btn-ghost btn">Home</button>
        <button id="goEdit" class="btn">Edit</button>
      </div>
    </div>
  </header>

  <!-- HOME -->
  <main id="home">
    <div class="list" id="labelList"></div>
    <div class="note">Tap a label to open its shops and items.</div>
  </main>

  <!-- EDIT -->
  <main id="edit" hidden>
    <section class="section">
      <details id="addShopBox">
        <summary>
          <span>Create new shop</span>
          <span class="small">tap to open/close</span>
        </summary>
        <div style="padding:10px 14px 14px">
          <div class="row">
            <div>
              <label class="label" for="shopName">Shop name</label>
              <input id="shopName" class="input" placeholder="e.g., Lidl, Zara" />
            </div>
            <div>
              <label class="label" for="shopCat">Main label</label>
              <select id="shopCat" class="select">
                <option>Groceries</option>
                <option>Clothes</option>
                <option>Presents</option>
              </select>
            </div>
          </div>
          <div class="inline" style="margin-top:10px">
            <button id="saveShop" class="btn">Save shop</button>
            <button id="clearForm" class="btn-ghost btn">Clear</button>
          </div>
        </div>
      </details>
    </section>

    <section class="section">
      <h2>Existing shops</h2>
      <div id="groups"></div>
      <div class="note">Tap any shop title to open and add items.</div>
    </section>
  </main>

<script>
(function(){
"use strict";

/* ---- Prevent iOS zoom on double-tap ---- */
let _lastTouchEnd=0;
document.addEventListener('touchend',function(e){
  const now=Date.now();
  if(now-_lastTouchEnd<=300){ e.preventDefault(); }
  _lastTouchEnd=now;
},{passive:false});

/* ---- Storage helpers ---- */
function createSafeStorage(){
  const mem={};
  try{ const k='__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }
  catch(e){ return { getItem:k=>mem[k]??null, setItem:(k,v)=>mem[k]=String(v), removeItem:k=>delete mem[k] }; }
}
const storage=createSafeStorage();
const KEY='shoptracker_elegant_v1';

const CATALOG={
  Groceries:['Milk','Eggs','Bread','Tomatoes','Apples','Yogurt','Cheese'],
  Clothes:['T-shirt','Jeans','Socks','Jacket','Belt'],
  Presents:['Gift card','Chocolate box','Flowers','Book','Toy']
};
function randFrom(a){ return a[Math.floor(Math.random()*a.length)]; }
function it(text){ return {id:uid(), text, done:false}; }
function randomItems(cat,n=3){
  const p=CATALOG[cat]||[]; const set=new Set();
  while(set.size<Math.min(n,p.length)) set.add(randFrom(p));
  return [...set].map(it);
}

const DEFAULT={
  categories:["Groceries","Clothes","Presents"],
  shops:[
    {id:uid(), name:"Local Market", category:"Groceries", items:randomItems("Groceries")},
    {id:uid(), name:"Uniqlo", category:"Clothes", items:randomItems("Clothes")},
    {id:uid(), name:"Bookstore", category:"Presents", items:randomItems("Presents")}
  ]
};

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function load(){ try{ const raw=storage.getItem(KEY); return raw?JSON.parse(raw):DEFAULT; }catch{return DEFAULT;} }
function save(){ storage.setItem(KEY, JSON.stringify(state)); }
let state=load();

/* ---- Nav ---- */
const home=document.getElementById('home');
const edit=document.getElementById('edit');
document.getElementById('goHome').onclick=()=>{ home.hidden=false; edit.hidden=true; renderHome(); };
document.getElementById('goEdit').onclick =()=>{ home.hidden=true;  edit.hidden=false;  renderEdit(); };
function cssId(s){ return s.replace(/\s+/g,'-').toLowerCase(); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function iconPath(cat){
  if(cat==='Groceries') return 'assets/icons/grocery.svg';
  if(cat==='Clothes')   return 'assets/icons/clothes.svg';
  if(cat==='Presents')  return 'assets/icons/presents.svg';
  return 'assets/icons/grocery.svg';
}
function pendingCountForCategory(cat){
  let n=0; state.shops.filter(s=>s.category===cat).forEach(s=>{ n+=s.items.filter(i=>!i.done).length; }); return n;
}
function pendingCountForShop(shop){ return shop.items.filter(i=>!i.done).length; }
function categoryOfShopId(shopId){ const s=state.shops.find(x=>x.id===shopId); return s?s.category:null; }

/* ---- HOME ---- */
const labelList=document.getElementById('labelList');
function renderHome(){
  labelList.innerHTML='';
  state.categories.forEach(cat=>{
    const pending=pendingCountForCategory(cat);
    const card=document.createElement('article');
    card.className='card';
    const id=cssId(cat);
    card.innerHTML=`
      <div class="card-header" data-cat="${cat}" role="button" aria-expanded="false" aria-controls="panel-${id}">
        <div class="badge"><img src="${iconPath(cat)}" alt="${cat} icon" loading="lazy"></div>
        <div class="meta">
          <h2>${cat}</h2>
          <p><span class="pill" id="pill-${id}">${pending}</span> items</p>
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="panel" id="panel-${id}"></div>`;
    labelList.appendChild(card);
  });

  labelList.querySelectorAll('.card-header').forEach(h=>{
    h.onclick=()=>{
      const cat=h.getAttribute('data-cat');
      const panel=document.getElementById('panel-'+cssId(cat));
      const open=!panel.classList.contains('open');
      labelList.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open'));
      labelList.querySelectorAll('.card-header[aria-expanded="true"]').forEach(x=>x.setAttribute('aria-expanded','false'));
      if(open){ h.setAttribute('aria-expanded','true'); renderCategoryPanel(cat,panel); panel.classList.add('open'); }
      else    { h.setAttribute('aria-expanded','false'); panel.classList.remove('open'); panel.innerHTML=''; }
    };
  });
}

function renderCategoryPanel(category, container){
  const shops=state.shops.filter(s=>s.category===category);
  container.innerHTML = shops.length ? '' : '<p class="small" style="margin:6px 0 0">No shops in this label. Add some in Edit.</p>';

  shops.forEach(shop=>{
    const pending=pendingCountForShop(shop);
    const block=document.createElement('div');
    block.className='shop';
    block.innerHTML=`
      <h3>
        <span>${escapeHtml(shop.name)}</span>
        <span class="pill" id="pill-shop-${shop.id}">${pending}</span>
      </h3>
      <hr>
      <ul class="items" id="ul-${shop.id}"></ul>`;
    container.appendChild(block);

    const ul=block.querySelector('.items');
    // Show up to 3 unchecked items in Home view
    const toBuy=shop.items.filter(i=>!i.done).slice(0,3);
    if(toBuy.length===0){
      ul.insertAdjacentHTML('beforeend','<li class="small" style="opacity:.8">Nothing to buy.</li>');
    } else {
      toBuy.forEach(i=>{
        ul.insertAdjacentHTML('beforeend',
          `<li class="item ${i.done?'done':''}" data-shop="${shop.id}" data-item="${i.id}">
            <input type="checkbox" ${i.done?'checked':''} aria-label="toggle ${escapeHtml(i.text)}">
            <label>${escapeHtml(i.text)}</label>
            <button class="remove" title="Remove">Remove</button>
          </li>`);
      });
    }

    // interactions for visible items
    ul.querySelectorAll('input[type="checkbox"]').forEach(cb=> cb.addEventListener('change', onToggleItem));
    ul.querySelectorAll('button.remove').forEach(btn=> btn.addEventListener('click', onRemoveItem));
  });
}

function onToggleItem(e){
  const li=e.target.closest('.item'); if(!li) return;
  const shop=state.shops.find(s=>s.id===li.dataset.shop);
  const item=shop?.items.find(i=>i.id===li.dataset.item); if(!item) return;
  item.done = e.target.checked;
  li.classList.toggle('done', item.done);
  save();

  // update pills
  const shopPill=document.getElementById('pill-shop-'+shop.id);
  if(shopPill) shopPill.textContent = pendingCountForShop(shop);
  const cat=categoryOfShopId(shop.id);
  const catPill=document.getElementById('pill-'+cssId(cat));
  if(catPill) catPill.textContent = pendingCountForCategory(cat);
}

function onRemoveItem(e){
  const li=e.target.closest('.item'); if(!li) return;
  const shop=state.shops.find(s=>s.id===li.dataset.shop); if(!shop) return;
  shop.items = shop.items.filter(i=> i.id !== li.dataset.item);
  li.remove();
  save();

  const shopPill=document.getElementById('pill-shop-'+shop.id);
  if(shopPill) shopPill.textContent = pendingCountForShop(shop);
  const cat=categoryOfShopId(shop.id);
  const catPill=document.getElementById('pill-'+cssId(cat));
  if(catPill) catPill.textContent = pendingCountForCategory(cat);
}

/* ---- EDIT ---- */
const addShopBox=document.getElementById('addShopBox');
const shopName=document.getElementById('shopName');
const shopCat=document.getElementById('shopCat');
const saveShop=document.getElementById('saveShop');
const clearForm=document.getElementById('clearForm');
const groups=document.getElementById('groups');

saveShop.onclick=()=>{
  const name=shopName.value.trim(); if(!name){ alert('Enter a shop name'); return; }
  const chosen=shopCat.value;
  const shop={ id:uid(), name, category:chosen, items:[] };
  state.shops.push(shop); save();
  shopName.value='';
  renderEdit(); renderHome();
  addShopBox.open=false;
};
clearForm.onclick=()=>{ shopName.value=''; shopCat.value='Groceries'; };

function renderEdit(){
  groups.innerHTML='';
  state.categories.forEach(cat=>{
    const shops=state.shops.filter(s=>s.category===cat);
    const section=document.createElement('div');
    section.innerHTML=`<h3 style="margin:0 0 8px">${cat}</h3><div id="grp-${cssId(cat)}"></div>`;
    groups.appendChild(section);
    const holder=section.querySelector('#grp-'+cssId(cat));

    if(!shops.length){
      holder.innerHTML = `<p class="small">No shops in ${cat}.</p>`;
      return;
    }

    shops.forEach(s=>{
      const box=document.createElement('div');
      box.className='shop';
      box.innerHTML=`
        <div class="shop-head" style="display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer">
          <strong>${escapeHtml(s.name)}</strong>
          <div>
            <button class="remove" data-remove="${s.id}" style="margin-right:8px">Remove</button>
            <span class="small">tap to open</span>
          </div>
        </div>
        <div class="shop-body" style="display:none; margin-top:8px">
          <div class="inline" style="margin:8px 0">
            <input class="input" id="in-${s.id}" placeholder="Add item to ${escapeHtml(s.name)}" />
            <button class="btn" data-add="${s.id}">Add</button>
          </div>
          <ul class="items" id="items-${s.id}"></ul>
        </div>`;
      holder.appendChild(box);

      const ul=box.querySelector('#items-'+s.id);
      s.items.forEach(itm=>{
        ul.insertAdjacentHTML('beforeend', editItemTemplate(s.id, itm));
      });

      // collapse/expand
      const head=box.querySelector('.shop-head');
      head.addEventListener('click',(ev)=>{
        if(ev.target && ev.target.getAttribute && ev.target.getAttribute('data-remove')) return;
        const body=box.querySelector('.shop-body');
        body.style.display = body.style.display==='none' ? 'block' : 'none';
      });
    });
  });

  // add item buttons
  groups.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const shopId=btn.getAttribute('data-add');
      const inp=document.getElementById('in-'+shopId);
      const v=(inp.value||'').trim(); if(!v) return;
      const shop=state.shops.find(x=>x.id===shopId); if(!shop) return;
      const newItem={id:uid(), text:v, done:false};
      shop.items.push(newItem); save();
      document.querySelector('#items-'+shopId)
        .insertAdjacentHTML('beforeend', editItemTemplate(shopId, newItem));
      inp.value=''; renderHome();
    });
  });
  // enter-to-add
  groups.querySelectorAll('input[id^="in-"]').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const shopId=inp.id.replace('in-','');
        const btn=groups.querySelector(`[data-add="${shopId}"]`);
        if(btn) btn.click();
      }
    });
  });
  // remove shop
  groups.querySelectorAll('[data-remove]').forEach(a=>{
    a.addEventListener('click', ()=>{
      const id=a.getAttribute('data-remove');
      const idx=state.shops.findIndex(s=>s.id===id);
      if(idx>-1 && confirm('Remove this shop?')){
        state.shops.splice(idx,1); save(); renderEdit(); renderHome();
      }
    });
  });
  // remove item (in edit list)
  groups.querySelectorAll('button[data-rm-item]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const shopId=b.getAttribute('data-shop');
      const itemId=b.getAttribute('data-rm-item');
      const shop=state.shops.find(s=>s.id===shopId); if(!shop) return;
      shop.items = shop.items.filter(i=> i.id !== itemId);
      save();
      const li=document.getElementById(`eitem-${itemId}`); if(li) li.remove();
      renderHome();
    });
  });
}

function editItemTemplate(shopId, item){
  return `<li class="item ${item.done?'done':''}" id="eitem-${item.id}">
    <input type="checkbox" ${item.done?'checked':''} disabled>
    <label>${escapeHtml(item.text)}</label>
    <button class="remove" data-shop="${shopId}" data-rm-item="${item.id}">Remove</button>
  </li>`;
}

/* ---- Init ---- */
renderHome();
document.getElementById('goEdit').addEventListener('click', ()=>{ renderEdit(); });

})();
</script>
</body>
</html>
